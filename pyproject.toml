[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftline"
version = "0.1.0"
description = "Personal project management tool: workload forecast and schedule tracking"
requires-python = ">=3.11"
readme = "README.md"
# Exact pins (architecture_spec §2), verified with Python 3.11.5: all tests green.
dependencies = [
    "dash==3.4.0",
    "plotly==6.9.0",
    "dash-bootstrap-components==2.0.4",
    "dash-ag-grid==33.3.3",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
driftline = "driftline.__main__:main"

[tool.setuptools.packages.find]
include = ["driftline*"]

[tool.setuptools.package-data]
"driftline.db" = ["schema.sql"]
"driftline.ui" = ["assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: performance tests (NFR-05)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
